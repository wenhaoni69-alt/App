plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenhao.medidor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wenhao.medidor'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        medidor {
            storeFile file('medidor.keystore')
            storePassword 'medidor123'
            keyAlias 'medidor'
            keyPassword 'medidor123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.medidor
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.ar:core:1.46.0'
}
