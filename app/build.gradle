plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenhao.medidor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wenhao.medidor'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "2.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        medidor {
            storeFile file('medidor.keystore')
            storePassword 'medidor123'
            keyAlias 'medidor'
            keyPassword 'medidor123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.medidor
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def camerax = '1.4.1'
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.guava:listenablefuture:1.0'
}
